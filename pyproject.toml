# Packaging descriptor for i2c.
#
# Phase 2 (§5.2): the framework ships as an importable `i2c` package with a
# console entry point. `pip install` (editable or wheel) puts the `i2c` command
# on PATH and bundles the JSON Schemas as package data; consumers no longer copy
# `tools/`. Governance markdown (instructions/, WORKER_SPEC.md, adapters) is
# still resolved from the project root — packaging those with override
# resolution is the separate §5.3 milestone.
#
# Not finalized before any real publish:
#   - the public distribution name (working name `i2c`; leaning `idea2code`)
#   - the [project.urls] entries (added once the public repo exists)

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "i2c"
version = "0.2.0"
description = "A governance framework for AI-driven software development: structured on-disk state and pre-assembled worker prompts."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Mike Yeluashvili" }]
keywords = ["ai", "agents", "governance", "llm", "code-generation", "workflow"]
dependencies = [
    "jsonschema>=4",
    # i2c.toml parsing: stdlib tomllib on 3.11+, tomli backport on 3.10.
    "tomli>=1.1.0; python_version < '3.11'",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

# Optional transport surfaces (§7.1, D-pkg-10): thin chat adapters over
# i2c.control. Core install stays stdlib + jsonschema; the bot deps are opt-in.
[project.optional-dependencies]
telegram = ["python-telegram-bot>=21"]

# [project.urls]
# Homepage = "..."      # add when the public repository exists
# Repository = "..."

[project.scripts]
i2c = "i2c.cli:main"  # console entry point over the i2c package

[tool.setuptools]
packages = ["i2c", "i2c.surfaces"]

[tool.setuptools.package-data]
# Framework-canonical assets ship inside the package. Schemas resolve via
# importlib.resources in i2c/validate.py; WORKER_SPEC.md + instructions resolve
# project-local-override-then-packaged in i2c/assemble_context.py (§5.3).
# adapters/ + templates/ are the `i2c init` scaffold sources (§5.4).
i2c = [
    "data/schemas/*.json",
    "data/pricing.json",
    "data/WORKER_SPEC.md",
    "data/instructions/*.md",
    "data/adapters/*.md",
    "data/templates/*.md",
    "data/templates/*.toml",
    "data/dashboard/*.html",
    "data/dashboard/*.css",
    "data/dashboard/*.js",
]
