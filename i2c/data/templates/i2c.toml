# i2c project configuration.
#
# Defaults for `i2c run`. Precedence: CLI flag > this file > built-in default.
# Uncomment and edit a key to change its default; commented keys fall back to
# the built-in (claude / sonnet / 5.00). Secrets / API keys do NOT belong here —
# configure those via environment variables (see the quickstart).

[run]
# backend = "[Backend]"      # claude | codex
# model = "sonnet"
# max_budget_usd = 5.00
# max_iteration_seconds = 1200  # per-iteration wall-clock ceiling; the worker is
                                # killed and the iteration aborts (exit 4) past it.
                                # 0 disables. Default 1200 (20 min).

# Optional: per-action backend, overriding [run].backend for that action.
# Lets you spread load across backends (e.g. heavy EXECUTE on codex, the rest
# on claude) or use an independent reviewer. `i2c run --backend X` overrides all.
# [run.backends]
# plan = "claude"
# execute = "codex"
# review = "claude"
# close = "claude"

# Optional but recommended: telemetry sidecar (.state/telemetry.jsonl) enrichment.
# test_cmd is the tests oracle — a shell command run in the project root after
# each worker invocation; its exit code is recorded as tests_pass (the metric the
# benchmark rests on). Leave it unset to keep the oracle off, but then tests_pass
# is null for the whole run and the runner warns on each iteration.
#
#   - Scope it to the frozen acceptance suite so tests_pass grades the contract,
#     not self-written unit tests: the {phase} placeholder is substituted by the
#     runner with the current phase number. (The worker's full suite still runs
#     at CLOSE — this is only the per-iteration oracle.)
#   - Chain typecheck/build so a compiled project can't record a false green
#     (green tests but a broken build): the WHOLE chain's exit code is the signal.
#
# [telemetry]
# test_cmd = "python -m pytest tests/acceptance/phase_{phase} -q"   # contract-scoped
# # compiled example — chain typecheck + build + the acceptance suite:
# # test_cmd = "tsc --noEmit && vitest run tests/acceptance/phase_{phase}"
#
# [telemetry.pricing] adds or overrides per-model rates (USD per 1M tokens),
# layered over the bundled pricing table, used to derive cost_usd / tier.
# [telemetry.pricing.my-model]
# tier = "T1"
# in = 3.00
# cached = 0.30
# out = 15.00
